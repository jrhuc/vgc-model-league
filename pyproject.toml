[project]
name = "vgcbench"
version = "0.1.0"
description = "LLM competitive Pokemon benchmark on the real Showdown simulator"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
    "google-genai",
    "rich",
]

[project.scripts]
vgcbench = "vgcbench.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vgcbench"]

[tool.setuptools.package-data]
vgcbench = ["showdown_timer.cjs"]
