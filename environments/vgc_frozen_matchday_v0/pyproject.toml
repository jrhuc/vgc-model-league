[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "vgc-frozen-matchday-v0"
version = "0.1.0"
description = "Internal matchday-only verifiers environment for the frozen VGC referee"
readme = "README.md"
requires-python = ">=3.11,<3.14"
classifiers = [
  "Private :: Do Not Upload",
]
dependencies = [
  "verifiers==0.3.0",
]

[dependency-groups]
test = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vgc_frozen_matchday_v0"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
