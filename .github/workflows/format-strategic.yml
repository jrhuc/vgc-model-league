name: Format strategic evaluation refactor

on:
  push:
    branches:
      - agent/strategic-evals-refactor
    paths:
      - .github/workflows/format-strategic.yml
      - README.md
      - docs/strategic-evals.md
      - src/eval/bo3-adaptation.ts
      - src/eval/controllers.ts
      - src/eval/experiment-kernel.ts
      - src/eval/fork-plan.ts
      - src/eval/information-set.ts
      - src/eval/reference-runner.ts
      - src/eval/reference-suite.ts
      - src/eval/strategic-task.ts
      - tests/eval-bo3-adaptation.test.ts
      - tests/eval-experiment-kernel.test.ts
      - tests/eval-fork-plan.test.ts
      - tests/eval-information-set.test.ts
      - tests/eval-reference-runner.test.ts
      - tests/eval-reference-suite.test.ts
      - tests/eval-strategic-task.test.ts

permissions:
  contents: write

concurrency:
  group: format-strategic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/strategic-evals-refactor
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical Biome formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome check --write \
            README.md \
            docs/strategic-evals.md \
            src/eval/bo3-adaptation.ts \
            src/eval/controllers.ts \
            src/eval/experiment-kernel.ts \
            src/eval/fork-plan.ts \
            src/eval/information-set.ts \
            src/eval/reference-runner.ts \
            src/eval/reference-suite.ts \
            src/eval/strategic-task.ts \
            tests/eval-bo3-adaptation.test.ts \
            tests/eval-experiment-kernel.test.ts \
            tests/eval-fork-plan.test.ts \
            tests/eval-information-set.test.ts \
            tests/eval-reference-runner.test.ts \
            tests/eval-reference-suite.test.ts \
            tests/eval-strategic-task.test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/strategic-evals.md src/eval tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(evaluation): apply repository formatting"
          git push origin HEAD:agent/strategic-evals-refactor
