name: Refactor prompt capability contracts

on:
  push:
    branches:
      - agent/strategic-evals-refactor
    paths:
      - .github/workflows/refactor-prompt-capabilities.yml
      - tools/apply-prompt-capability-refactor.py

permissions:
  contents: write

concurrency:
  group: refactor-prompt-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/strategic-evals-refactor
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:showdown
      - run: python tools/apply-prompt-capability-refactor.py
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome check --write \
            src/prompt-capabilities.ts \
            src/draft.ts \
            src/teambuild.ts \
            src/trade-window.ts \
            src/frozen-circuit-setup.ts \
            src/frozen-circuit-referee.ts \
            src/frozen-circuit-transactions.ts \
            tests/frozen-circuit-prompt-capabilities.test.ts \
            docs/strategic-evals.md
          pnpm run build
          pnpm run build:frozen-circuit
          node --test --test-timeout=300000 dist/tests/frozen-circuit-prompt-capabilities.test.js
      - name: Commit refactor and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/refactor-prompt-capabilities.yml tools/apply-prompt-capability-refactor.py
          git add src tests/frozen-circuit-prompt-capabilities.test.ts docs/strategic-evals.md
          git commit -m "refactor(scaffold): bind prompts to mechanics-tool capability"
          git push origin HEAD:agent/strategic-evals-refactor
