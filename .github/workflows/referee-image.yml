name: Referee image

on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Additional release tag for this deliberately selected ref
        required: true
        type: string
  pull_request:
    paths:
      - '.dockerignore'
      - '.npmrc'
      - 'Dockerfile.referee'
      - 'LICENSE'
      - 'boards/regmb-202607.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'showdown.lock.json'
      - 'src/**'
      - 'teams/vr-aug26-top8/**'
      - 'tools/frozen-circuit-referee.ts'
      - 'tools/setup-showdown.mjs'
      - 'tools/vgc-draft-circuit-referee'
      - 'tsconfig.json'
      - 'tsconfig.frozen-circuit.json'
      - '.github/workflows/referee-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: referee-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jrhuc/vgc-draft-circuit-referee

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ inputs.release_tag || 'manual' }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=VGC Draft Circuit Referee
            org.opencontainers.image.description=Pinned JSONL referee for the VGC draft circuit environment
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile.referee
          load: true
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test ready JSONL as non-root
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE}:${GITHUB_SHA}"
          uid="$(docker run --rm --entrypoint id "$image" -u)"
          test "$uid" != 0
          ready="$(timeout 15s docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true "$image" </dev/null)"
          expected_showdown="$(jq -er '.commit | select(test("^[0-9a-f]{40}$"))' showdown.lock.json)"
          test "$(printf '%s\n' "$ready" | wc -l)" -eq 1
          printf '%s\n' "$ready" | jq -e --arg showdown "$expected_showdown" '
            .kind == "ready" and
            .protocolVersion == 1 and
            .circuitProtocolVersion == 2 and
            .promptProtocolVersion == 2 and
            .matchdayProtocolVersion == 1 and
            .battleProtocolVersion == 1 and
            .showdownRevision == $showdown
          '
      - if: github.event_name != 'pull_request'
        name: Publish image tags
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -z "$tag" || docker push "$tag"
          done <<'TAGS'
          ${{ steps.metadata.outputs.tags }}
          TAGS
