name: Fix matchday memory boundary v3

on:
  push:
    branches:
      - agent/strategic-evals-refactor
    paths:
      - .github/workflows/fix-matchday-memory-boundary-v3.yml
      - tools/fix-matchday-memory-boundary-v3.py

permissions:
  contents: write

concurrency:
  group: fix-matchday-memory-boundary-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/strategic-evals-refactor
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:showdown
      - run: python tools/fix-matchday-memory-boundary-v3.py
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome check --write \
            src/eval/frozen-matchday-adapter.ts \
            src/eval/frontier-pilot.ts \
            tests/eval-frozen-matchday-adapter.test.ts \
            tests/eval-frontier-pilot.test.ts \
            docs/strategic-evals.md \
            docs/usage.md
          pnpm run check
          pnpm run build
          node --test --test-timeout=300000 \
            dist/tests/eval-frozen-matchday-adapter.test.js \
            dist/tests/eval-frontier-pilot.test.js
      - name: Commit boundary fix and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/fix-matchday-memory-boundary.yml \
            .github/workflows/fix-matchday-memory-boundary-v2.yml \
            .github/workflows/fix-matchday-memory-boundary-v3.yml \
            tools/fix-matchday-memory-boundary.py \
            tools/fix-matchday-memory-boundary-v2.py \
            tools/fix-matchday-memory-boundary-v3.py
          git add src/eval tests docs
          git commit -m "fix(evaluation): isolate notebook treatment from source POV"
          git push origin HEAD:agent/strategic-evals-refactor
