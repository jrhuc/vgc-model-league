name: Fix strategic evaluation contracts

on:
  push:
    branches:
      - agent/strategic-evals-refactor
    paths:
      - .github/workflows/fix-strategic-contracts.yml
      - tools/fix-strategic-contracts.py

permissions:
  contents: write

concurrency:
  group: fix-strategic-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/strategic-evals-refactor
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:showdown
      - run: python tools/fix-strategic-contracts.py
      - name: Format and validate
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec biome check --write \
            src/eval/frozen-circuit-adapter.ts \
            src/eval/strategic-task.ts \
            tests/eval-frozen-circuit-adapter.test.ts \
            tests/eval-strategic-task.test.ts
          pnpm run check
          pnpm run build
          node --test --test-timeout=300000 \
            dist/tests/eval-frozen-circuit-adapter.test.js \
            dist/tests/eval-strategic-task.test.js
      - name: Commit fixes and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm \
            .github/workflows/fix-strategic-contracts.yml \
            tools/fix-strategic-contracts.py
          git add src/eval tests
          git commit -m "fix(evaluation): tighten strategic task contracts"
          git push origin HEAD:agent/strategic-evals-refactor
